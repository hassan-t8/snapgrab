# SnapGrab — installed as /etc/nginx/sites-available/zz-snapgrab.
# Named "zz-" so it loads after wepowerenergysolutions.com and WePower stays
# Nginx's fallback server. Own logs, own certificate, no global settings changed.
# No "http2" on listen: on nginx 1.24 that would also switch WePower's :443 to HTTP/2.
# When a real domain is bought, add it to server_name, get a certificate for it and
# remove the X-Robots-Tag line.

server {
    listen 80;
    listen [::]:80;
    server_name snapgrab.185-211-6-213.sslip.io;

    access_log /var/log/nginx/snapgrab.access.log;
    error_log  /var/log/nginx/snapgrab.error.log;

    location ^~ /.well-known/acme-challenge/ { root /var/www/snapgrab-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name snapgrab.185-211-6-213.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/snapgrab.185-211-6-213.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snapgrab.185-211-6-213.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/snapgrab.access.log;
    error_log  /var/log/nginx/snapgrab.error.log;

    client_max_body_size 5m;
    add_header X-Robots-Tag "noindex, nofollow" always;   # test address: keep it out of Google until the real domain

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location /_next/static/ {
        proxy_pass http://[::1]:3200;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://[::1]:3200;
        # the downloader streams large files through /api/download
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
